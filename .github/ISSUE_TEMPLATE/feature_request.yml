name: Feature request
description: Suggest a feature for Arynox AI
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point or use case.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you imagine it working? UI, API, agent behavior...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Anything you already tried or other approaches.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: Backend (agents / providers / API)
        - label: Frontend (IDE / UI)
        - label: Integrations (GitHub / MCP / providers)
        - label: Docs / DX
